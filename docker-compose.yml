# ─────────────────────────────────────────────────────────────────────────────
#  Local / VPS deployment with Docker Compose.
#  Railway and Render do NOT use this file — they build the Dockerfile directly.
#
#     1. cp sample.env .env      # then fill in your credentials
#     2. docker compose up -d --build
#     3. docker compose logs -f
# ─────────────────────────────────────────────────────────────────────────────
services:
  myra:
    build: .
    image: myra-bot
    container_name: myra_bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "5000"
      TZ: Asia/Kolkata
    ports:
      - "5000:5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-5000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
